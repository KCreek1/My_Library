{% extends "layout.html" %}
{% block page_class %}page-profile{% endblock %}
{% block content %}
<section class="profile-heading">
  <span class="profile-eyebrow">Your profile</span>
  <h1>{{ username }}</h1>
</section>

<div class="profile-actions">
  <a href="{{ url_for('auth.change_password') }}" class="btn btn-secondary">Change Password</a>
  <a href="{{ url_for('auth.delete_account') }}" class="btn btn-danger">Delete Account</a>
</div>

<div class="alert alert-info profile-update-note" role="alert">
  More updates coming soon!
</div>
{% endblock %}
