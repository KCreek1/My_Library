{% extends "layout.html" %}
{% block page_class %}page-profile{% endblock %}
{% block content %}
<section class="profile-heading">
  <span class="profile-eyebrow">Your profile</span>
  <h1>{{ username }}</h1>
</section>

<a href="{{ url_for('auth.change_password') }}" class="btn btn-secondary mb-2">Change Password</a>
<br>
<a href="{{ url_for('auth.delete_account') }}" class="btn btn-danger mb-3">Delete Account</a>

<div class="alert alert-info mt-4" role="alert">
  More updates coming soon!
</div>
{% endblock %}
